{% extends "base.html" %}

{% block title %}Schedule · Diffido{% end %}
{% block body %}
<form class="card" data-page="schedule" novalidate>
    <header class="page-header">
        <div><p class="eyebrow">Page monitoring</p><h1>Schedule</h1></div>
        <a class="button secondary" href="/">Back</a>
    </header>
    <p class="status" role="status" aria-live="polite"></p>
    <div class="form-grid">
        <label>Title<input name="title" required autocomplete="off"></label>
        <label>URL<input name="url" type="url" required placeholder="https://example.com" autocomplete="url"></label>
        <label>Notification email<input name="email" type="email" autocomplete="email"></label>
        <label>XPath selector<input name="xpath" autocomplete="off"></label>
        <label>Minimum change<input name="minimum_change" type="number" min="0" max="1" step="0.01"></label>
        <label class="switch"><input name="enabled" type="checkbox" checked><span>Enabled</span></label>
    </div>
    <fieldset><legend>Check frequency</legend>
        <label>Type<select name="trigger"><option value="interval">Interval</option><option value="cron">Cron expression</option></select></label>
        <div class="interval-fields form-grid">
            <label>Weeks<input name="interval_weeks" type="number" min="0"></label>
            <label>Days<input name="interval_days" type="number" min="0"></label>
            <label>Hours<input name="interval_hours" type="number" min="0"></label>
            <label>Minutes<input name="interval_minutes" type="number" min="0"></label>
            <label>Seconds<input name="interval_seconds" type="number" min="0"></label>
        </div>
        <label class="cron-field">Crontab<input name="cron_crontab" placeholder="*/5 * * * *" autocomplete="off"></label>
    </fieldset>
    <div class="actions"><button class="button primary" type="submit">Save schedule</button><button class="button danger delete" type="button">Delete schedule</button></div>
</form>
{% end %}
