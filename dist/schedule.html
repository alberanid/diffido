{% extends "base.html" %}

{% block title %}Schedule · Diffido{% end %}
{% block body %}
<form class="card" data-page="schedule" novalidate>
    <header class="page-header">
        <div><p class="eyebrow">Page monitoring</p><h1>Schedule</h1></div>
        <a class="button secondary" href="/"><span class="material-icons" aria-hidden="true">arrow_back</span>Back</a>
    </header>
    <p class="status" role="status" aria-live="polite"></p>
    <div class="form-grid">
        <label>Title<input name="title" required autocomplete="off"></label>
        <label>URL<input name="url" type="url" required placeholder="https://example.com" autocomplete="url"></label>
        <label>Notification email<input name="email" type="email" autocomplete="email"></label>
        <label>XPath selector<input name="xpath" autocomplete="off"></label>
        <label>Minimum change<input name="minimum_change" type="number" min="0" max="1" step="0.01"></label>
        <label class="switch"><input name="enabled" type="checkbox" checked><span>Enabled</span></label>
    </div>
    <fieldset><legend>Check frequency</legend>
        <label>Type<select name="trigger"><option value="interval">Interval</option><option value="cron">Cron expression</option></select></label>
        <div class="interval-fields form-grid">
            <label>Weeks<input name="interval_weeks" type="number" min="0"></label>
            <label>Days<input name="interval_days" type="number" min="0"></label>
            <label>Hours<input name="interval_hours" type="number" min="0"></label>
            <label>Minutes<input name="interval_minutes" type="number" min="0"></label>
            <label>Seconds<input name="interval_seconds" type="number" min="0"></label>
        </div>
        <label class="cron-field">Crontab<input name="cron_crontab" placeholder="*/5 * * * *" autocomplete="off"></label>
    </fieldset>
    <fieldset><legend class="http-legend">HTTP request</legend>
        <label class="http-only">Method<select name="http_method"><option value="GET" selected>GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="DELETE">DELETE</option><option value="OPTIONS">OPTIONS</option></select></label>
        <label class="http-only">Authentication<select name="auth_type"><option value="">None</option><option value="basic">Basic</option><option value="digest">Digest</option><option value="bearer">Bearer token</option></select></label>
        <div class="auth-cred-fields form-grid">
            <label>Username<input name="auth_username" autocomplete="off"></label>
            <label>Password<input name="auth_password" autocomplete="off"></label>
        </div>
        <label class="auth-token-field">Bearer token<input name="auth_token" autocomplete="off"></label>
        <label class="http-only">Custom headers<textarea name="custom_headers" rows="3" placeholder="X-Api-Key: secret" autocomplete="off"></textarea></label>
        <label class="http-only">Cookies<input name="cookies" placeholder="name=value; other=value" autocomplete="off"></label>
        <div class="body-fields form-grid">
            <label>Request body<textarea name="request_body" rows="3" autocomplete="off"></textarea></label>
            <label>Content type<input name="body_content_type" placeholder="application/json" autocomplete="off"></label>
        </div>
    </fieldset>
    <div class="actions"><button class="button primary" type="submit"><span class="material-icons" aria-hidden="true">save</span>Save schedule</button><button class="button danger delete" type="button"><span class="material-icons" aria-hidden="true">delete</span>Delete schedule</button></div>
</form>
{% end %}
