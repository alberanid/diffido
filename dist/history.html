{% extends "base.html" %}

{% block title %}History · Diffido{% end %}
{% block body %}
<section class="card" data-page="history">
    <header class="page-header"><div><p class="eyebrow">Revision history</p><h1></h1></div><a class="button secondary" href="/"><span class="material-icons" aria-hidden="true">arrow_back</span>Back</a></header>
    <p class="status" role="status" aria-live="polite"></p>
    <label class="switch"><input type="checkbox" name="show-empty"><span>Show entries with no changes</span></label>
    <div class="table-wrap"><table><thead><tr><th scope="col">Revision</th><th scope="col">Changes</th><th scope="col">Checked</th><th scope="col">Diff</th><th scope="col">Page</th></tr></thead><tbody></tbody></table></div>
    <nav class="pagination" aria-label="History pagination"></nav>
</section>
{% end %}
