<!doctype html>
<html lang="en">
    <head>
        <title>{% block title %}diffido{% end %}</title>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1" name="viewport">
        <meta name="color-scheme" content="light">
        <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
        <link rel="stylesheet" href="{{ static_url('iconfont/material-icons.css') }}">
        {% block head %}{% end %}
        {% block style %}{% end %}
    </head>
    <body>
        <main class="page-shell">
        {% block body %}{% end %}
        </main>
        <div class="toast" role="status" aria-live="polite"></div>
        <footer>
            <span><a href="https://github.com/alberanid/diffido" target="_blank" rel="noopener">diffido</a> {{ version }} &copy; <a href="http://www.mimante.net/" target="_blank" rel="noopener">Davide Alberani</a></span>
        </footer>
        <script src="{{ static_url('js/app.js') }}" defer></script>
        {% block scripts %}{% end %}
    </body>
</html>
